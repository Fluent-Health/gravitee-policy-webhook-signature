name: Integration matrix

# Reusable workflow. Runs the container-backed integration test against every
# Gravitee APIM version the policy is expected to support.
#
# Every leg is explicitly pinned rather than tracking the floating `latest`
# Docker tag, so CI stays deterministic and a version bump is always a
# deliberate, reviewable change.

on:
  workflow_call:

# Least privilege by default. A called workflow can never receive more than the
# calling job grants it, but declare it here too so the constraint is visible
# at the point of use.
permissions:
  contents: read

jobs:
  integration:
    name: APIM ${{ matrix.apim }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      # Report every leg. A break on one version must not hide the result for
      # the others.
      fail-fast: false
      matrix:
        apim:
          # Oldest supported APIM. Guards against accidentally depending on a
          # later 4.12.x addition.
          - "4.12.0"
          # Latest verified release: early warning for upstream breakage
          # (policy API changes, EL changes, management schema validation).
          - "4.12.20"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false

      # `mvn verify` packages the plugin ZIP (the IT mounts it into the
      # containers) and then runs surefire + failsafe.
      - name: Integration test (E2EGatewayIT)
        run: >
          mvn verify --batch-mode -q
          -Dapim.version=${{ matrix.apim }}
